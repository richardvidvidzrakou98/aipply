# Aipply - Job Search Settings
# Copy this to settings.yaml and customize for your search

search:
  keywords:
    - "your keyword 1"
    - "your keyword 2"
  locations:
    - "San Francisco Bay Area"
    - "Remote"
  experience_levels:
    - "Mid-Senior level"
    - "Director"
    - "Associate"
  job_types:
    - "Full-time"

exclusions:
  companies:
    - "Your Current Employer"

application:
  email: "your.email@example.com"
  auto_apply: true
  max_applications_per_cycle: 10

schedule:
  interval_hours: 1

# Optional AI configuration. Add OPENROUTER_API_KEY to .env.
llm:
  # OpenRouter routes this alias to an available free model.
  model: "openrouter/free"
  fallback_models:
    - "nvidia/nemotron-3-ultra-550b-a55b:free"
    - "qwen/qwen3.8-27b:free"
  temperature: 0.7
  max_tokens: 2000
